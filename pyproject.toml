[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cruzl-labs"
version = "0.2.0"
description = "AI-native memory layer untuk agent — ringan, self-host, dari nol. DNA dari Mem0/Hindsight/Honcho/Zep."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "0xcruzl", email = "cruzlxyz@users.noreply.github.com" }]
keywords = ["memory", "ai", "agent", "llm", "memory-layer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/cruzlxyz/cruzl-labs"
Repository = "https://github.com/cruzlxyz/cruzl-labs"

[project.scripts]
cruzl = "cli:main"
cruzl-api = "api:main"

[tool.setuptools]
packages = ["src"]
